name: fork build and release

on:
  push:
    branches:
      - 'codex/**'
    tags:
      - '*-jerry.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  LIGHTPANDA_DISABLE_TELEMETRY: 'true'

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-jerry\.[0-9]+$ ]]
            release_version="$REF_NAME"
          else
            release_version=1.0.0-jerry.dev
          fi
          # Explicit build metadata avoids resolveVersion appending a commit count.
          echo "BINARY_VERSION=$release_version+git.${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      # Reuse the upstream pinned actions and prebuilt static V8 archive.
      - uses: ./.github/actions/install
        with:
          os: linux
          arch: x86_64

      - name: Check Zig formatting
        run: zig fmt --check ./

      - name: Run all Zig tests with leak detection
        env:
          TEST_FAIL_FIRST: 'true'
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Ddev_fast=false test

      - name: Generate V8 snapshot
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin

      - name: Build Linux amd64 release binary
        run: |
          zig build -Dsnapshot_path=../../snapshot.bin \
            -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast \
            -Dorderfile=orderfile/lightpanda.ld -Dcpu=x86_64 \
            "-Dversion=$BINARY_VERSION"
          mkdir -p dist
          cp zig-out/bin/lightpanda dist/lightpanda-x86_64-linux
          test "$(dist/lightpanda-x86_64-linux version)" = "$BINARY_VERSION"

      - name: Check Botly container compatibility
        run: |
          docker pull node:22-bookworm
          docker run --rm --network none --user 1000:1000 \
            -v "$PWD/dist:/opt/lightpanda:ro" \
            -e "EXPECTED_VERSION=$BINARY_VERSION" \
            -e LIGHTPANDA_DISABLE_TELEMETRY=true \
            --entrypoint sh node:22-bookworm -ec '
              test "$(/opt/lightpanda/lightpanda-x86_64-linux version)" = "$EXPECTED_VERSION"
              /opt/lightpanda/lightpanda-x86_64-linux help mcp > /dev/null
              /opt/lightpanda/lightpanda-x86_64-linux help serve > /dev/null
            '

      - name: Record provenance and checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, 'rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          binary = Path('dist/lightpanda-x86_64-linux')
          provenance = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceCommit': os.environ['GITHUB_SHA'],
              'sourceRef': os.environ['GITHUB_REF'],
              'upstreamBaseCommit': output('git', 'rev-parse', '1.0.0^{commit}'),
              'workflowRun': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'binaryVersion': os.environ['BINARY_VERSION'],
              'platform': 'linux/amd64',
              'binary': binary.name,
              'size': binary.stat().st_size,
              'sha256': sha256(binary),
              'zigVersion': output('zig', 'version'),
              'rustVersion': output('rustc', '--version'),
              'v8ArchiveSha256': sha256('v8/libc_v8.a'),
              'cargoLockSha256': sha256('src/rust/Cargo.lock'),
              'containerSmokeImage': json.loads(output('docker', 'image', 'inspect', 'node:22-bookworm', '--format', '{{json .RepoDigests}}')),
              'validation': ['zig-fmt', 'full-debug-zig-tests', 'node-22-bookworm-version-and-cli-smoke'],
          }
          Path('dist/provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          (cd dist && sha256sum lightpanda-x86_64-linux provenance.json > SHA256SUMS)

      - name: Upload tested build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightpanda-x86_64-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lightpanda-x86_64-linux
          path: dist

      - name: Publish a new experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          cat > release-notes.md <<'EOF'
          Experimental Lightpanda fork for Botly browser compatibility testing.

          Assets were built from the tagged source after Zig formatting, all Zig tests (debug/leak detection), and a Node 22 Bookworm container CLI smoke check passed. This does not assert carrier workflow compatibility.

          `provenance.json` records the exact source, binary version, toolchains, V8 archive checksum, and build run. `SHA256SUMS` covers both the Linux amd64 binary and provenance.
          EOF
          # create fails if the release exists; never replace a published asset.
          gh release create "$RELEASE_TAG" \
            dist/lightpanda-x86_64-linux dist/SHA256SUMS dist/provenance.json \
            --verify-tag --prerelease --latest=false \
            --title "Lightpanda $RELEASE_TAG" --notes-file release-notes.md
